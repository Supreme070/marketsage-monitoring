global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    replica: 'prometheus-1'
    cluster: 'marketsage-monitoring'
    environment: 'production'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Static configuration for core monitoring services
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    basic_auth:
      username: 'admin'
      password: 'monitoring123'

  # Docker service discovery for dynamic container monitoring
  - job_name: 'docker-containers'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["monitoring.prometheus.scrape=true"]
    relabel_configs:
      # Only scrape containers with monitoring label
      - source_labels: [__meta_docker_container_label_monitoring_prometheus_scrape]
        action: keep
        regex: true
      
      # Use custom port if specified
      - source_labels: [__meta_docker_container_label_monitoring_prometheus_port]
        action: replace
        target_label: __address__
        regex: (.+)
        replacement: ${1}
      
      # Use container name as instance
      - source_labels: [__meta_docker_container_name]
        action: replace
        target_label: instance
        regex: /(.+)
        replacement: ${1}
      
      # Add container labels as metrics labels
      - source_labels: [__meta_docker_container_label_monitoring_prometheus_job]
        action: replace
        target_label: job
      
      - source_labels: [__meta_docker_container_label_monitoring_service_name]
        action: replace
        target_label: service_name
      
      - source_labels: [__meta_docker_container_label_monitoring_service_version]
        action: replace
        target_label: service_version
      
      # Add environment from label
      - source_labels: [__meta_docker_container_label_monitoring_environment]
        action: replace
        target_label: environment
        
      # Set metrics path if specified
      - source_labels: [__meta_docker_container_label_monitoring_prometheus_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

  # File-based service discovery for external services
  - job_name: 'file-sd-services'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.json'
        refresh_interval: 30s
    relabel_configs:
      # Add service metadata from file
      - source_labels: [__meta_filepath]
        action: replace
        target_label: config_file
        regex: /etc/prometheus/targets/(.+)\.json
        replacement: ${1}

  # Consul service discovery (if using Consul)
  - job_name: 'consul-services'
    consul_sd_configs:
      - server: 'consul:8500'
        tags:
          - monitoring
        refresh_interval: 30s
    relabel_configs:
      # Only scrape services with monitoring tag
      - source_labels: [__meta_consul_tags]
        action: keep
        regex: .*,monitoring,.*
      
      # Use service name as job
      - source_labels: [__meta_consul_service]
        action: replace
        target_label: job
      
      # Use node name as instance
      - source_labels: [__meta_consul_node]
        action: replace
        target_label: instance

  # Kubernetes service discovery (if using Kubernetes)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - marketsage
            - monitoring
    relabel_configs:
      # Only scrape pods with prometheus.io/scrape annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      
      # Use custom port if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      
      # Use custom path if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      # Add pod metadata
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
      
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app

  # HTTP service discovery for dynamic endpoints
  - job_name: 'http-sd-services'
    http_sd_configs:
      - url: 'http://service-discovery:8080/prometheus/targets'
        refresh_interval: 60s
    relabel_configs:
      # Use service name from HTTP SD
      - source_labels: [service_name]
        action: replace
        target_label: job
      
      # Add environment from HTTP SD
      - source_labels: [environment]
        action: replace
        target_label: environment

  # Static configuration for core infrastructure
  - job_name: 'node-exporters'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # Database monitoring with service discovery
  - job_name: 'postgres-discovery'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/postgres-*.json'
    relabel_configs:
      - source_labels: [__meta_filepath]
        action: replace
        target_label: database_cluster
        regex: /etc/prometheus/targets/postgres-(.+)\.json
        replacement: ${1}

  - job_name: 'redis-discovery'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/redis-*.json'
    relabel_configs:
      - source_labels: [__meta_filepath]
        action: replace
        target_label: redis_cluster
        regex: /etc/prometheus/targets/redis-(.+)\.json
        replacement: ${1}

  # Business application discovery
  - job_name: 'marketsage-services'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["marketsage.monitoring=true"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_marketsage_monitoring]
        action: keep
        regex: true
      
      - source_labels: [__meta_docker_container_label_marketsage_service_name]
        action: replace
        target_label: service_name
      
      - source_labels: [__meta_docker_container_label_marketsage_service_type]
        action: replace
        target_label: service_type
      
      - source_labels: [__meta_docker_container_name]
        action: replace
        target_label: instance
        regex: /(.+)
        replacement: ${1}

  # External service health checks
  - job_name: 'external-services'
    static_configs:
      - targets: 
          - 'marketsage.africa'
          - 'api.marketsage.africa'
    metrics_path: '/health'
    scrape_interval: 60s
    scrape_timeout: 10s
    scheme: https

  # Third-party service monitoring
  - job_name: 'third-party-apis'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/third-party-*.json'
    scrape_interval: 120s
    metrics_path: '/status'