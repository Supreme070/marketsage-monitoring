global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    replica: 'prometheus-1'
    cluster: 'marketsage-monitoring'
    environment: 'production'

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    basic_auth:
      username: 'admin'
      password: 'monitoring123'

  # Alloy monitoring
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']
    scrape_interval: 30s
    scrape_timeout: 10s

  # MarketSage application is monitored via container metrics (cadvisor)
  # Health status can be checked via external monitoring if needed

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    honor_timestamps: false

  # System metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 30s

  # Alertmanager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 30s

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s

  # Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    scrape_interval: 30s

  # Business metrics for MarketSage KPIs
  - job_name: 'business-metrics'
    static_configs:
      - targets: ['business-metrics-exporter:8080']
    scrape_interval: 60s
    metrics_path: /metrics
    honor_timestamps: true
    scrape_timeout: 30s

  # Synthetic monitoring for uptime and user journey testing
  - job_name: 'synthetic-monitoring'
    static_configs:
      - targets: ['synthetic-monitoring:8082']
    scrape_interval: 60s
    metrics_path: /metrics
    honor_timestamps: true
    scrape_timeout: 30s

  # Compliance monitoring for GDPR, security, and cost tracking
  - job_name: 'compliance-monitor'
    static_configs:
      - targets: ['compliance-monitor:8083']
    scrape_interval: 120s
    metrics_path: /metrics
    honor_timestamps: true
    scrape_timeout: 30s

  # MCP monitoring for Model Context Protocol observability
  - job_name: 'mcp-monitor'
    static_configs:
      - targets: ['mcp-monitor:8084']
    scrape_interval: 15s
    metrics_path: /metrics
    honor_timestamps: true
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'mcp_.*'
        target_label: __tmp_mcp_metric
        replacement: 'true'