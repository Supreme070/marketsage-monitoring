version: '3.8'

services:
  # Grafana for visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: marketsage-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: false
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
      - marketsage_default
      - marketsage_backend_default
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - monitoring
      - all

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: marketsage-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - marketsage_default
      - marketsage_backend_default
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - monitoring
      - all

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: marketsage-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - monitoring
      - all

  # Tempo for distributed tracing
  tempo:
    image: grafana/tempo:latest
    container_name: marketsage-tempo
    restart: unless-stopped
    user: "0:0"  # Run as root to avoid permission issues
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo
    networks:
      - monitoring
      - marketsage_default
      - marketsage_backend_default
    # Note: No healthcheck - Tempo uses distroless images without shell/wget/curl
    # Grafana's official examples omit healthcheck for this reason
    profiles:
      - monitoring
      - all

  # Alertmanager for alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: marketsage-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - monitoring
      - all

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: marketsage-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    profiles:
      - monitoring
      - all

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: marketsage-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - monitoring
    profiles:
      - monitoring
      - all

  # PostgreSQL Exporter (conditional)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: marketsage-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://marketsage:${POSTGRES_PASSWORD:-marketsage_password}@marketsage-db-production:5432/marketsage?sslmode=disable
    networks:
      - monitoring
      - marketsage_default
      - marketsage_backend_default
    profiles:
      - monitoring
      - postgres

  # Redis Exporter (conditional)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: marketsage-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://marketsage-redis-production:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - monitoring
      - marketsage_default
      - marketsage_backend_default
    profiles:
      - monitoring
      - redis

volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  monitoring:
    driver: bridge
    name: marketsage_monitoring
  # External networks to connect to MarketSage services
  marketsage_default:
    external: true
    name: marketsage-network
  marketsage_backend_default:
    external: true
    name: marketsage-network