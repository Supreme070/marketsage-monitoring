services:
  # Grafana for visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
      - GF_SECURITY_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=warn
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    command: ["grafana-server", "--config=/etc/grafana/grafana.ini", "--homepath=/usr/share/grafana"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /etc/ssl/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
    secrets:
      - grafana_admin_password
      - grafana_cloud_api_key
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus
      - loki
      - tempo

  # Grafana Alloy for metrics and log collection
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "12345:12345"   # Alloy HTTP
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      - GRAFANA_CLOUD_API_KEY_FILE=/run/secrets/grafana_cloud_api_key
      - GRAFANA_CLOUD_PROMETHEUS_URL=${GRAFANA_CLOUD_PROMETHEUS_URL}
      - GRAFANA_CLOUD_PROMETHEUS_USER=${GRAFANA_CLOUD_PROMETHEUS_USER}
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL}
      - GRAFANA_CLOUD_LOKI_USER=${GRAFANA_CLOUD_LOKI_USER}
      - MARKETSAGE_APP_URL=${MARKETSAGE_APP_URL:-marketsage-web:3000}
    volumes:
      - ./alloy/config:/etc/alloy:ro
      - ./alloy/rules:/etc/prometheus/rules:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    secrets:
      - grafana_cloud_api_key
      - prometheus_basic_auth
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus
      - loki
      - tempo

  # Local Prometheus for backup and local queries
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=50GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.config.file=/etc/prometheus/web-config.yml
      - --query.max-concurrency=20
      - --query.max-samples=50000000
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/web-config.yml:/etc/prometheus/web-config.yml:ro
      - ./alloy/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      - /etc/ssl/certs:/etc/ssl/certs:ro
    secrets:
      - prometheus_basic_auth
    networks:
      - monitoring
    depends_on:
      - alertmanager

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      - monitoring

  # Tempo for distributed tracing
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    ports:
      - "3200:3200"     # Tempo HTTP
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "9411:9411"     # Zipkin
      - "14268:14268"   # Jaeger HTTP
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./config/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus

  # Alertmanager for alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
      - /etc/ssl/certs:/etc/ssl/certs:ro
    secrets:
      - smtp_password
      - slack_webhook_url
    networks:
      monitoring:
        ipv4_address: 172.19.0.10

  # PostgreSQL Exporter for database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    volumes:
      - ./config/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    environment:
      - DATA_SOURCE_NAME=postgresql://marketsage:${POSTGRES_PASSWORD:-password}@marketsage-db:5432/marketsage?sslmode=disable
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus

  # Redis Exporter for cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://marketsage-valkey:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Business Metrics Exporter for MarketSage KPIs
  business-metrics-exporter:
    build:
      context: ./services/business-metrics-exporter
      dockerfile: Dockerfile
    container_name: business-metrics-exporter
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATABASE_URL=postgresql://marketsage:${POSTGRES_PASSWORD:-marketsage_password}@marketsage-db:5432/marketsage
      - REDIS_HOST=marketsage-valkey
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - METRICS_COLLECTION_INTERVAL=300  # 5 minutes
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Synthetic Monitoring for uptime and user journey testing
  synthetic-monitoring:
    build:
      context: ./services/synthetic-monitoring
      dockerfile: Dockerfile
    container_name: synthetic-monitoring
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=production
      - PORT=8082
      - MARKETSAGE_BASE_URL=http://marketsage-web:3000
      - CHECK_SSL_DOMAINS=marketsage.africa,www.marketsage.africa
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./services/synthetic-monitoring/logs:/app/logs
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Compliance and Cost Monitoring
  compliance-monitor:
    build:
      context: ./services/compliance-monitor
      dockerfile: Dockerfile
    container_name: compliance-monitor
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - NODE_ENV=production
      - PORT=8083
      - DATABASE_URL=postgresql://marketsage:${POSTGRES_PASSWORD:-marketsage_password}@marketsage-db:5432/marketsage
      - REDIS_HOST=marketsage-valkey
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./services/compliance-monitor/logs:/app/logs
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # MCP Monitor for Model Context Protocol observability
  mcp-monitor:
    build:
      context: ./services/mcp-monitor
      dockerfile: Dockerfile
    container_name: mcp-monitor
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - NODE_ENV=production
      - PORT=8084
      - LOG_LEVEL=info
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://tempo:14268/api/traces
      - OTEL_SERVICE_NAME=mcp-monitor
      - OTEL_RESOURCE_ATTRIBUTES=service.name=mcp-monitor,service.version=1.0.0
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./services/mcp-monitor/logs:/app/logs
      - ./services/mcp-monitor/config:/app/config:ro
    networks:
      - monitoring
      - marketsage_default
    depends_on:
      - prometheus
      - tempo
      - loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

# Docker secrets for sensitive data
secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  grafana_cloud_api_key:
    file: ./secrets/grafana_cloud_api_key.txt
  prometheus_basic_auth:
    file: ./secrets/prometheus_basic_auth.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
  slack_webhook_url:
    file: ./secrets/slack_webhook_url.txt

# Persistent volumes
volumes:
  grafana-data:
    driver: local
  alloy-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  alertmanager-data:
    driver: local

# Networks:
networks:
  monitoring:
    driver: bridge
    name: monitoring
    ipam:
      config:
        - subnet: 172.19.0.0/16
  # External network for MarketSage connection
  marketsage_default:
    external: true
    name: ${MARKETSAGE_NETWORK:-marketsage_marketsage}
